name: async_confirm_dialog_example
description: >-
  Demonstrates how to use the async_confirm_dialog package with standard,
  destructive, and async confirmation dialogs.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  async_confirm_dialog:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true